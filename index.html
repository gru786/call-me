<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Gaurav</title>

    <meta
        name="description"
        content="Get in touch with Gaurav Singh via phone, WhatsApp or email."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            color: white;

            background:
                radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #06b6d4 0%, transparent 35%),
                linear-gradient(135deg, #0f172a, #111827, #020617);

            overflow: hidden;
        }

        /* Decorative background circles */

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: #8b5cf6;
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #06b6d4;
            bottom: -150px;
            right: -100px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            position: relative;
            z-index: 1;
        }

        .card {
            padding: 42px 30px 30px;

            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-radius: 28px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.35);

            text-align: center;

            animation: appear 0.7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 92px;
            height: 92px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 34px;
            font-weight: 700;

            background:
                linear-gradient(135deg, #6366f1, #06b6d4);

            border: 4px solid rgba(255,255,255,0.25);

            box-shadow:
                0 10px 35px rgba(99, 102, 241, 0.45);
        }

        h1 {
            font-size: 30px;
            line-height: 1.2;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255,255,255,0.70);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .button {
            display: flex;
            align-items: center;

            padding: 16px 18px;

            border-radius: 16px;

            text-decoration: none;
            color: white;

            font-size: 16px;
            font-weight: 600;

            border: 1px solid rgba(255,255,255,0.12);

            background: rgba(255,255,255,0.08);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-3px);

            background: rgba(255,255,255,0.15);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.2);
        }

        .icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            margin-right: 14px;

            font-size: 20px;

            background: rgba(255,255,255,0.12);
        }

        .button-text {
            text-align: left;
            flex: 1;
        }

        .button-title {
            display: block;
            margin-bottom: 2px;
        }

        .button-description {
            display: block;

            font-size: 12px;
            font-weight: 400;

            color: rgba(255,255,255,0.55);
        }

        .arrow {
            font-size: 20px;
            opacity: 0.5;
        }

        .footer {
            margin-top: 25px;

            font-size: 12px;

            color: rgba(255,255,255,0.35);
        }

        @media (max-width: 480px) {

            body {
                padding: 16px;
            }

            .card {
                padding: 35px 20px 25px;
                border-radius: 24px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="avatar">
                GS
            </div>

            <h1>Contact Gaurav</h1>

            <p class="subtitle">
                Have something to discuss?<br>
                I'd love to hear from you.
            </p>

            <div class="buttons">

                <!-- CALL -->

                <a
                    class="button"
                    href="tel:+91XXXXXXXXXX"
                >
                    <div class="icon">📞</div>

                    <div class="button-text">
                        <span class="button-title">
                            Call Gaurav
                        </span>

                        <span class="button-description">
                            Give me a call directly
                        </span>
                    </div>

                    <span class="arrow">›</span>
                </a>


                <!-- WHATSAPP -->

                <a
                    class="button"
                    href="https://wa.me/YOUR_NUMBER"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <div class="icon">💬</div>

                    <div class="button-text">
                        <span class="button-title">
                            WhatsApp Gaurav
                        </span>

                        <span class="button-description">
                            Send me a WhatsApp message
                        </span>
                    </div>

                    <span class="arrow">›</span>
                </a>


                <!-- EMAIL -->

                <a
                    class="button"
                    href="mailto:shahgaurav786@gmail.com"
                >
                    <div class="icon">✉️</div>

                    <div class="button-text">
                        <span class="button-title">
                            Email Gaurav
                        </span>

                        <span class="button-description">
                            shahgaurav786@gmail.com
                        </span>
                    </div>

                    <span class="arrow">›</span>
                </a>

            </div>

            <div class="footer">
                © Gaurav Singh
            </div>

        </div>

    </main>

</body>
</html>
