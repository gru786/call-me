<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Gaurav</title>

    <meta
        name="description"
        content="Get in touch with Gaurav Singh via phone, WhatsApp or email."
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(99, 102, 241, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(6, 182, 212, 0.30),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #020617
                );

            overflow-x: hidden;
        }


        /* Background decoration */

        .background-circle {
            position: fixed;

            border-radius: 50%;

            filter: blur(90px);

            opacity: 0.25;

            pointer-events: none;
        }

        .circle-one {
            width: 300px;
            height: 300px;

            background: #6366f1;

            top: -120px;
            left: -120px;
        }

        .circle-two {
            width: 350px;
            height: 350px;

            background: #06b6d4;

            bottom: -150px;
            right: -120px;
        }


        /* Main container */

        .container {
            width: 100%;
            max-width: 430px;

            position: relative;

            z-index: 2;
        }


        /* Card */

        .card {
            padding: 40px 28px 28px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.09);

            border:
                1px solid rgba(255, 255, 255, 0.16);

            border-radius: 30px;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.40);

            animation:
                cardAppear 0.7s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* Profile image */

        .profile-wrapper {
    width: 120px;
    height: 120px;

    margin: 0 auto 20px;

    padding: 4px;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #818cf8,
        #06b6d4
    );

    box-shadow:
        0 12px 40px rgba(99, 102, 241, 0.40);

    overflow: hidden;
}


.profile-image {
    width: 100%;
    height: 100%;

    display: block;

    border-radius: 50%;

    object-fit: cover;

    object-position: center 50%;

    border: 3px solid #111827;
}
        /* Heading */

        h1 {
            font-size: 30px;

            font-weight: 700;

            letter-spacing: -0.6px;

            margin-bottom: 8px;
        }


        .subtitle {
            color:
                rgba(255, 255, 255, 0.68);

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* Contact buttons */

        .buttons {
            display: flex;

            flex-direction: column;

            gap: 13px;
        }


        .button {
            display: flex;

            align-items: center;

            width: 100%;

            padding: 15px 16px;

            color: white;

            text-decoration: none;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid rgba(255, 255, 255, 0.11);

            border-radius: 17px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .button:hover {
            transform: translateY(-3px);

            background:
                rgba(255, 255, 255, 0.14);

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.25);
        }


        .button:active {
            transform: scale(0.98);
        }


        /* Icons */

        .icon {
            width: 44px;
            height: 44px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-right: 14px;

            font-size: 20px;

            border-radius: 13px;

            background:
                rgba(255, 255, 255, 0.10);
        }


        /* Text */

        .button-text {
            flex: 1;

            text-align: left;
        }


        .button-title {
            display: block;

            font-size: 16px;

            font-weight: 600;

            margin-bottom: 3px;
        }


        .button-description {
            display: block;

            color:
                rgba(255, 255, 255, 0.52);

            font-size: 12px;

            font-weight: 400;
        }


        .arrow {
            font-size: 23px;

            color:
                rgba(255, 255, 255, 0.35);
        }


        /* Footer */

        .footer {
            margin-top: 26px;

            color:
                rgba(255, 255, 255, 0.30);

            font-size: 12px;
        }


        /* Mobile */

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 34px 20px 25px;

                border-radius: 26px;
            }

            .profile-wrapper {
                width: 110px;
                height: 110px;
            }

            h1 {
                font-size: 27px;
            }

            .subtitle {
                margin-bottom: 25px;
            }
        }

    </style>
</head>


<body>

    <!-- Background decoration -->

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>


    <main class="container">

        <section class="card">

            <!-- Profile photo -->

            <div class="profile-wrapper">

                <img
                    src="gaurav.jpg"
                    alt="Gaurav Singh"
                    class="profile-image"
                >

            </div>


            <!-- Introduction -->

            <h1>Contact Gaurav</h1>

            <p class="subtitle">
                Have something to discuss?<br>
                I'd love to hear from you.
            </p>


            <!-- Contact options -->

            <div class="buttons">


                <!-- Phone -->

                <a
                    class="button"
                    href="tel:+918565074473"
                >

                    <div class="icon">
                        📞
                    </div>

                    <div class="button-text">

                        <span class="button-title">
                            Call Gaurav
                        </span>

                        <span class="button-description">
                            Give me a call directly
                        </span>

                    </div>

                    <span class="arrow">
                        ›
                    </span>

                </a>


                <!-- WhatsApp -->

                <a
                    class="button"
                    href="https://wa.me/918565074473"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="icon">
                        💬
                    </div>

                    <div class="button-text">

                        <span class="button-title">
                            WhatsApp Gaurav
                        </span>

                        <span class="button-description">
                            Send me a WhatsApp message
                        </span>

                    </div>

                    <span class="arrow">
                        ›
                    </span>

                </a>


                <!-- Email -->

                <a
                    class="button"
                    href="mailto:shahgaurav786@gmail.com"
                >

                    <div class="icon">
                        ✉️
                    </div>

                    <div class="button-text">

                        <span class="button-title">
                            Email Gaurav
                        </span>

                        <span class="button-description">
                            shahgaurav786@gmail.com
                        </span>

                    </div>

                    <span class="arrow">
                        ›
                    </span>

                </a>


            </div>


            <div class="footer">
                © Gaurav Singh
            </div>

        </section>

    </main>

</body>

</html>
